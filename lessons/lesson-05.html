  <script>
    Lesson.render({"month":5,"track":"JavaScript","emoji":"💾","title":"Память браузера и бэкап","intro":"Сегодня магия: закрыл вкладку — открыл, а задачи на месте. А ещё сделаем «сохранение в игре»: экспорт в JSON, импорт обратно и безопасное удаление данных.","whatYouLearn":["объект состояния и JSON","localStorage: setItem и getItem","экспорт и импорт резервной копии","проверка файла и безопасное удаление"],"steps":[{"type":"theory","tag":"теория","title":"localStorage — как блокнот","html":"<p><strong>localStorage<\/strong> хранит строки в браузере. Объект превращается в строку через <strong>JSON.stringify<\/strong>, а обратно — через <strong>JSON.parse<\/strong>. Один ключ приложения — один «блокнот».<\/p>","code":"const state = { xp: 15, tasks: [] };\n\nlocalStorage.setItem('school_planner_v3', JSON.stringify(state));\n\nconst saved = JSON.parse(localStorage.getItem('school_planner_v3'));\nconsole.log(saved.xp);","tip":"Сохранять нужно данные, а не HTML. Тогда интерфейс можно перерисовать как угодно."},{"type":"theory","tag":"теория","title":"Бэкап: экспорт и импорт","html":"<p>Это как сохранение в игре: экспорт — «сохраниться», импорт — «загрузить сохранение». Только файл лежит у тебя, а не на сервере.<\/p><p>Данные в браузере можно потерять: очистил кеш, сменил телефон, экспериментировал в DevTools. Поэтому приложение умеет <strong>экспортировать<\/strong> состояние в JSON-файл и <strong>импортировать<\/strong> его обратно.<\/p><p>Экспорт — это не просто «скачать текст». В файл кладут версию, дату, блоки и настройки. Импорт сначала проверяет, что это файл ежедневника (<code>meta.app<\/code>), и только потом восстанавливает данные.<\/p>","code":"{\n  \"meta\": { \"app\": \"school-planner\", \"version\": 3 },\n  \"blocks\": [{ \"type\": \"todo\" }],\n  \"xp\": 120,\n  \"theme\": { \"mode\": \"dark\" }\n}","tip":"Полный экспорт заменяет все данные, а экспорт за месяц или период — добавляет записи к текущим. Перед импортом не помешает сделать свежий экспорт."},{"type":"quiz","tag":"проверка","title":"Проверь себя","questions":[{"text":"Что будет с массивом задач после F5, если его не сохранить?","options":["исчезнет","сохранится сам","переедет в CSS"],"answer":0,"explain":"Всё, что живёт только в переменных, теряется при перезагрузке."},{"text":"Зачем try/catch вокруг JSON.parse?","options":["если в хранилище мусор, приложение не упадёт","чтобы ускорить парсинг","чтобы данные шифровались"],"answer":0,"explain":"Битый JSON — обычная история после экспериментов в DevTools."},{"text":"Зачем при импорте проверять meta.app?","options":["чтобы не загрузить в ежедневник чужой JSON","чтобы ускорить чтение","чтобы файл стал меньше"],"answer":0,"explain":"Проверка защищает от случайного файла из другого приложения."},{"text":"Что делает полный импорт резервной копии?","options":["заменяет текущие данные данными из файла","добавляет только одну задачу","удаляет файл"],"answer":0,"explain":"Полный бэкап — это восстановление: состояние становится таким, каким было при экспорте."}]},{"type":"playground","tag":"практика","title":"Туда и обратно","intro":"В песочнице урока localStorage недоступен, поэтому потренируемся на самом формате. С хранилищем поработаешь в проекте.","task":"Сделай объект настроек, преврати его в JSON через <code>JSON.stringify<\/code>, распарси обратно через <code>JSON.parse<\/code> и выведи результат в консоль.","start":"<script>\nconst settings = { work: 25, rest: 5 };\n\n// stringify → parse → console.log\n<\/script>\n","check":["json.stringify","json.parse","console.log"],"hint":"const raw = JSON.stringify(settings); const back = JSON.parse(raw); console.log(back);","success":"Теперь localStorage для тебя — просто блокнот с ключами."},{"type":"checklist","tag":"практика","title":"Проверь в проекте","intro":"Эти вещи проверяются руками в браузере.","items":["Открыл DevTools → Application → Local Storage и увидел один общий ключ","Добавил задачу, обновил страницу — задача на месте","Сделал экспорт JSON и увидел в файле meta.app и свои задачи","Импортировал этот же файл обратно — данные на месте","Кнопка «Удалить все данные» спрашивает подтверждение"]},{"type":"quiz","boss":true,"tag":"финальный экзамен","title":"Финальный экзамен","questions":[{"text":"Где хранится localStorage?","options":["в браузере ученика","на сервере школы","в файле index.html"],"answer":0,"explain":"Это локальное хранилище браузера: другой компьютер данных не увидит."},{"text":"Что такое ключ хранилища?","options":["имя, по которому лежат данные","пароль","номер версии браузера"],"answer":0,"explain":"Ключ — как подпись на коробке. У приложения один ключ: school_planner_v3."},{"text":"Где безопаснее хранить резервную копию?","options":["в отдельном файле или облаке, а не только в браузере","в той же вкладке","в кеше браузера"],"answer":0,"explain":"Если данные только в браузере, очистка кеша их заберёт. Файл-бэкап — страховка."}]}],"next":"lesson-06.html"});
  </script>
