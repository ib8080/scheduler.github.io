    Lesson.render({"month":7,"track":"Архитектура","emoji":"🗂️","title":"Файлы, модули и опыт","intro":"Один файл на 800 строк — это боль. Разложим код по полочкам и добавим первое удовольствие от работы: опыт, уровни и серию дней.","whatYouLearn":["модуль на IIFE и window.App","порядок подключения скриптов","XP, уровни и серия дней","почему опыт нельзя начислить дважды","настройки, импорт и удаление — отдельный модуль"],"steps":[{"type":"theory","tag":"теория","title":"Один объект вместо свалки","html":"<p>Модуль — это функция, которая сразу вызывается и прячет свои переменные внутри. Наружу отдаём только нужное, через общий объект <strong>window.App<\/strong>.<\/p><p>Настройки, экспорт и импорт — тоже отдельный модуль. Ему не нужно тянуть за собой весь интерфейс: он читает файл, проверяет данные и обновляет состояние.<\/p>","code":"(function (App) {\n  'use strict';\n\n  function addXP(amount) {\n    App.state.xp += amount;\n  }\n\n  App.xp = { addXP: addXP };\n})(window.App = window.App || {});","tip":"Порядок подключения важен: config → utils → storage → state → экраны → app.js."},{"type":"theory","tag":"теория","title":"Опыт без дюпов","html":"<p>Опыт начисляют один раз за задачу. Для этого у задачи есть флаг <strong>xpGiven<\/strong>: отметил — начислил, снял галочку — забрал обратно, повторил — не начислил второй раз.<\/p>","code":"function toggleTask(task) {\n  if (task.done && !task.xpGiven) {\n    task.xpGiven = true;\n    addXP(15);\n  } else if (!task.done && task.xpGiven) {\n    task.xpGiven = false;\n    addXP(-15);\n  }\n}","tip":"Серия дней — это сколько дней подряд ты получал опыт. Пропустил день — начинается заново."},{"type":"quiz","tag":"проверка","title":"Проверь себя","questions":[{"text":"Зачем window.App?","options":["один общий объект вместо десятков глобальных переменных","чтобы код работал быстрее","чтобы подключить React"],"answer":0,"explain":"Одна точка входа — и порядок загрузки понятен, и конфликтов имён нет."},{"text":"Почему опыт не
