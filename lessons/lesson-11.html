    Lesson.render({"month":11,"track":"Таймеры","emoji":"⏱️","title":"Помодоро и таймеры","intro":"25 минут работы, 5 минут отдыха. Звучит просто, но чтобы таймер не врал после перезагрузки, нужно хранить не счётчик, а время окончания. А кнопка «Сброс» должна возвращать нас в режим задачи.","whatYouLearn":["setInterval и Date.now","метка endAt вместо счётчика","пауза, продолжение и сброс","звук окончания фазы"],"steps":[{"type":"theory","tag":"теория","title":"Считать не тики, а время","html":"<p>Если хранить «осталось 1500 секунд» и вычитать по секунде, в фоновой вкладке браузер притормозит таймер — и время уплывёт. Надёжнее запомнить <strong>момент окончания<\/strong> и каждый раз считать разницу.<\/p>","code":"state.endAt = Date.now() + 25 * 60 * 1000;\n\nsetInterval(function () {\n  const left = Math.max(0, Math.round((state.endAt - Date.now()) / 1000));\n  render(left);\n}, 1000);","tip":"Пауза: сохрани остаток в remaining и обнули endAt. Продолжение: endAt = сейчас + remaining."},{"type":"theory","tag":"теория","title":"Сброс и звук","html":"<p>Это как кнопка «заново» в игре: не продолжает старый уровень, а начинает новый.<\/p><p>Кнопка «Сброс» возвращает таймер не туда, где он был, а в <strong>режим задачи<\/strong>: снова 25 минут работы. Это удобно, если перерыв закончился раньше или ты хочешь начать новый помидор.<\/p><p>Когда время выходит, приложение показывает оверлей и играет выбранный звук. Встроенные сигналы — «Марш Тореадора» и «Grandfather clock»; можно добавить свой mp3 или wav.<\/p>","code":"function reset() {\n  state.phase = \"work\";\n  state.remaining = state.settings.work * 60;\n  state.endAt = null;\n}","tip":"Звук — отдельная настройка. Генерацию мелодий разбирать не будем: важно, что таймер умеет сообщить о конце."},{"type":"quiz","tag":"проверка","title":"Проверь себя","questions":[{"text":"Почему счётчик «минус один каждую секунду» плох?","options":["в фоновой вкладке таймеры режутся, и время уплывает","счётчик нельзя сохранить","число
