    Lesson.render({"month":12,"track":"Финал","emoji":"🏁","title":"Полировка и защита","intro":"Последний рывок: проверяем темы, бэкап и установку, находим крайние случаи и готовимся показать проект. Это самая недооценённая часть работы — и самая важная.","whatYouLearn":["темы и CSS-переменные","экспорт, импорт и удаление данных","установка приложения и офлайн","доступность и крайние случаи","как рассказать о проекте за 5 минут"],"steps":[{"type":"theory","tag":"теория","title":"Проверь себя на прочность","html":"<p>Хороший проект отличается не тем, как работает в идеальных условиях, а тем, как не ломается в странных: пустые списки, 200 задач, длинные названия, сброс данных.<\/p><p>Доступность — это не «для галочки»: иконочные кнопки должны иметь <strong>aria-label<\/strong>, а всё важное — фокус с клавиатуры.<\/p>","code":"<button type=\"button\" aria-label=\"Удалить задачу\">✕<\/button>\n\n.task-text {\n  overflow-wrap: anywhere;\n}\n.card { min-width: 0; }","tip":"Проверь на 360px: если появилась горизонтальная прокрутка — ищи элемент шире экрана."},{"type":"theory","tag":"теория","title":"Тема, бэкап и установка","html":"<p>Финальная проверка — не только «нет ли ошибок». Проверь три вещи, которые легко забыть:<\/p><ul><li><strong>Тема.<\/strong> Светлая, тёмная и своя тема должны менять все экраны, включая нижнюю навигацию и страницы уроков. Список переменных и классов — в <a href=\"../css-classes.html\" target=\"_blank\" rel=\"noopener\">css-classes.html<\/a>.<\/li><li><strong>Бэкап.<\/strong> Экспорт JSON, импорт обратно и удаление всех данных с подтверждением.<\/li><li><strong>Установка.<\/strong> На телефоне приложение ставится на главный экран и работает офлайн.<\/li><\/ul>","code":"Экспорт → файл planner.json\nИмпорт → проверка meta.app → восстановление\nУдаление → подтверждение → чистые данные","tip":"Перед удалением данных всегда делай экспорт. Это правило спасает нервы."},{"type":"quiz","tag":"проверка","title":"Проверь себя","questions":[{"text":"Что будет, если в названии задачи 200 символов?","options":["вёрстка не должна разъехаться — нужны overflow-wrap и min-width: 0","ничего, браузер сам разберётся","задача не сохранится"],"answer":0,"explain":"Длинные строки без переносов выталкивают карточку за экран."},{"text":"Зачем aria-label у кнопки с иконкой ✕?","options":["скринридер прочитает «удалить», а не «икс»","для красоты","чтобы кнопка работала"],"answer":0,"explain":"Смысл должен быть доступен и без зрения, и без наведения мыши."},{"text":"Что проверить перед удалением всех данных?","options":["сделать резервную копию экспортом","закрыть браузер","удалить CSS"],"answer":0,"explain":"Удаление необратимо. Экспорт — страховка."}]},{"type":"checklist","tag":"практика","title":"Финальная приёмка","intro":"Пройди по списку — это и есть готовность проекта.","items":["Нет горизонтальной прокрутки на ширине 360px","В консоли нет ошибок при обычном сценарии","Данные на месте после F5 (задачи, расписание, цели, опыт)","Светлая, тёмная и своя тема меняют все экраны, включая нижнюю навигацию","Экспорт → импорт возвращает те же данные","«Удалить все данные» спрашивает подтверждение и оставляет чистый старт","Приложение устанавливается на главный экран и открывается офлайн","README объясняет, как запустить проект","Прошёл сценарий: задача → галочка → опыт → итоги"]},{"type":"quiz","boss":true,"tag":"финальный экзамен","title":"Финальный экзамен","questions":[{"text":"Что показать на защите в первую очередь?","options":["рабочий сценарий: задача → галочка → опыт → итоги","список всех файлов","только код"],"answer":0,"explain":"Сначала результат, потом детали. Люди запоминают историю, а не дерево папок."},{"text":"Друг нашёл баг. Что делать?","options":["записать шаги и починить — это подарок","удалить функцию","сказать, что так и задумано"],"answer":0,"explain":"Баг — это информация. Хороший разработчик благодарит и исправляет."},{"text":"Какой бэкап считается надёжным?","options":["JSON-файл, сохранённый отдельно от брау
